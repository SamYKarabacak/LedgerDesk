name: Verify and publish LedgerDesk 1.1.0

on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-release.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Verify the release ZIP on Windows
    runs-on: windows-2022
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - uses: actions/download-artifact@v8
        with:
          name: LedgerDesk-Windows-x64
          run-id: 39463188031
          github-token: ${{ github.token }}
          path: downloads
      - name: Verify the prepared ZIP and run its EXE
        shell: python
        run: |
          import hashlib
          import json
          import os
          from pathlib import Path
          import shutil
          import subprocess
          import zipfile

          folder = Path(os.environ["RUNNER_TEMP"]) / "LedgerDesk release check \u00e7"
          folder.mkdir(parents=True, exist_ok=True)
          archive = Path("downloads/LedgerDesk-v1.1.0-Windows-x64.zip").resolve()
          expected = "57418ba6e0a50951ed93fba2523e77ee9e3d9ab15cf2d63b812d389bd9b36f0b"
          if hashlib.sha256(archive.read_bytes()).hexdigest() != expected:
              raise SystemExit("The release ZIP checksum does not match.")
          with zipfile.ZipFile(archive) as package:
              package.extractall(folder)
          source = folder / "LedgerDesk/app/income_tracker.py"
          if source.read_text(encoding="utf-8") != Path("income_tracker.py").read_text(encoding="utf-8"):
              raise SystemExit("The bundled source differs from the repository.")
          report = folder / "self-test-report.json"
          executable = folder / "LedgerDesk/LedgerDesk.exe"
          result = subprocess.run(
              [str(executable), "--self-test-report", str(report)], timeout=60)
          if report.exists():
              print(report.read_text(encoding="utf-8"), flush=True)
              shutil.copyfile(report, "windows-self-test.json")
          if result.returncode != 0:
              raise SystemExit(f"The packaged EXE exited with {result.returncode}.")
          data = json.loads(report.read_text(encoding="utf-8"))
          if data.get("status") != "passed" or data.get("platform") != "win32":
              raise SystemExit("The packaged Windows self-test did not pass.")
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: LedgerDesk-Windows-self-test
          path: windows-self-test.json
          if-no-files-found: ignore

  publish:
    name: Publish the verified Windows download
    needs: windows
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Publish the prepared release
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import json
          import os
          import subprocess

          repo = os.environ["GITHUB_REPOSITORY"]
          endpoint = f"repos/{repo}/releases/418656542"
          release = json.loads(subprocess.check_output(["gh", "api", endpoint], text=True))
          if release["tag_name"] != "v1.1.0":
              raise SystemExit("The prepared release version changed.")
          assets = {item["name"]: item for item in release["assets"]}
          package = assets.get("LedgerDesk-v1.1.0-Windows-x64.zip", {})
          digest = "sha256:57418ba6e0a50951ed93fba2523e77ee9e3d9ab15cf2d63b812d389bd9b36f0b"
          if package.get("id") != 659960726 or package.get("digest") != digest:
              raise SystemExit("The prepared release asset changed.")
          if "LedgerDesk-v1.1.0-Windows-x64.zip.sha256" not in assets:
              raise SystemExit("The release checksum file is missing.")
          run = os.environ["GITHUB_SERVER_URL"] + "/" + repo + "/actions/runs/" + os.environ["GITHUB_RUN_ID"]
          notes = (
              "Offline income and expense tracking for Windows, by SamYKar / BravenDev.\n\n"
              "Download LedgerDesk-v1.1.0-Windows-x64.zip below, extract the complete folder, "
              "and open LedgerDesk.exe. Python is included. Keep the app and runtime folders beside the EXE.\n\n"
              "Includes transaction editing, separate currency views, charts, filters, CSV export, "
              "backups, and restore with a safety copy. Your records stay on your computer.\n\n"
              "Validation: 19 source checks passed on Linux and Windows with Python 3.10 and 3.14. "
              "The attached ZIP passed its native Windows self-test, including the Tk window, "
              "transaction dialog, SQLite, edit, delete/undo, CSV, and backup/restore.\n\n"
              "[Windows verification](" + run + ")."
          )
          payload = {"tag_name": "v1.1.0", "target_commitish": os.environ["GITHUB_SHA"],
                     "draft": False, "prerelease": False, "make_latest": "true", "body": notes}
          subprocess.run(
              ["gh", "api", "--method", "PATCH", endpoint, "--input", "-"],
              input=json.dumps(payload), text=True, check=True)
